<script nonce="rAnd0m123">
document.addEventListener("DOMContentLoaded", function() {
    const banner = document.getElementById("cookie-banner");
    const overlay = document.getElementById("consent-overlay");
    const acceptBtn = document.getElementById("accept-btn");
    const rejectBtn = document.getElementById("reject-btn");

    if (localStorage.getItem("user-consent")) return;

    const translations = {
        'ar': {
            message: 'نستخدم ملفات تعريف الارتباط لتحسين تجربتك وعرض الإعلانات. هل توافق؟',
            accept: 'أوافق', reject: 'أرفض', direction: 'rtl'
        },
        'en': {
            message: 'We use cookies to enhance your experience. Do you agree?',
            accept: 'Accept', reject: 'Reject', direction: 'ltr'
        }
    };

    const userLang = (navigator.language || navigator.userLanguage).startsWith('ar') ? 'ar' : 'en';
    const t = translations[userLang];

    document.getElementById('cookie-message').textContent = t.message;
    acceptBtn.textContent = t.accept;
    rejectBtn.textContent = t.reject;
    banner.style.direction = t.direction;
    
    banner.style.display = "flex";
    overlay.style.display = "block";

    acceptBtn.onclick = () => {
        if (typeof setConsent === "function") setConsent("granted");
        closeBanner();
    };
    rejectBtn.onclick = () => {
        if (typeof setConsent === "function") setConsent("denied");
        closeBanner();
    };

    function closeBanner() {
        banner.style.display = "none";
        overlay.style.display = "none";
        localStorage.setItem("user-consent", "true");
    }
});
</script>
