document.addEventListener("DOMContentLoaded", function() {

    const translations = {

    };

    const lang = localStorage.getItem('lang') === 'en' ? 'en' : 'ar';
    document.getElementById('cookie-message').textContent = translations[lang].msg;
    document.getElementById('accept-btn').textContent = translations[lang].yes;
    document.getElementById('reject-btn').textContent = translations[lang].no;
    
    banner.style.display = "flex";
    overlay.style.display = "block";

    document.getElementById('accept-btn').onclick = () => { setConsent("granted"); closeB(); };
    document.getElementById('reject-btn').onclick = () => { setConsent("denied"); closeB(); };
    function closeB() { 
        banner.style.display="none"; 
        overlay.style.display="none"; 
        localStorage.setItem("user-consent","true"); 
    }

    // ربط أزرار المقالات برمجياً لمنع أخطاء CSP
    const pBtn = document.getElementById('prev-btn');
    const nBtn = document.getElementById('next-btn');
    if(pBtn && typeof prevArticle === 'function') pBtn.addEventListener('click', prevArticle);

});
