<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إزالة خلفية الصورة - Temp Box Mail</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <div class="nav">
        <div class="logo" onclick="window.location.href='/'" style="cursor:pointer;">📧 Temp Box Mail</div>
        <nav class="menu">
            <a href="/">الرئيسية</a>
            <a href="/tools/index.html">الأدوات الذكية</a>
        </nav>
    </div>
</header>

<main class="container" style="padding: 40px 0;">
    <h1 class="section-title" style="text-align: center;">🎭 إزالة الخلفية بالذكاء الاصطناعي</h1>
    
    <div id="dropZone" class="tool-card" style="max-width: 600px; margin: 40px auto; padding: 40px; border: 1px solid #334155; border-radius: 16px; text-align: center; background: #1e293b;">
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <button class="tool-btn" style="background: #00ffcc; color: #0d1117; padding: 12px 24px; border-radius: 8px; border:none; cursor:pointer; font-weight: bold;" onclick="document.getElementById('imageInput').click()">اختر الصورة</button>
        <p id="fileName" style="margin-top: 15px; color: #94a3b8;">لم يتم اختيار ملف</p>
    </div>

    <div id="loadingZone" style="display:none; text-align:center; padding: 40px;">
        <div class="spinner" style="width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid #00ffcc; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div> 
        <p style="color: #00ffcc;">جاري معالجة الصورة وإزالة الخلفية...</p>
    </div>

    <div id="resultZone" style="display:none; text-align:center; padding: 20px;">
        <img id="resultPreview" style="max-width: 500px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155;">
        <br>
        <button id="downloadBtn" class="tool-btn" style="background: linear-gradient(135deg, #00ffcc, #00a3ff); color: #0d1117; padding: 14px 40px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;" onclick="downloadImage()">تحميل الصورة الشفافة</button>
    </div>
</main>

<footer>
  <div class="copy" style="text-align: center; padding: 20px; color: #64748b;">© 2026 Temp Box Mail. All rights reserved.</div>
</footer>

<script>
    // الأنماط الحركية للـ Spinner
    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(style);

    // دالة المعالجة
    document.getElementById('imageInput').onchange = async function() {
        const file = this.files[0];
        if(!file) return;
        
        document.getElementById('dropZone').style.display = "none";
        document.getElementById('loadingZone').style.display = "block";

        const formData = new FormData();
        formData.append('image', file);

        try {
            // تأكد من استبدال الرابط أدناه برابط الـ API الخاص بـ Hugging Face الخاص بك
            const response = await fetch("https://hamedabdelmoez-watermark-remover.hf.space/api/remove-bg", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            if (data.image) {
                document.getElementById("resultPreview").src = data.image;
                document.getElementById("loadingZone").style.display = "none";
                document.getElementById("resultZone").style.display = "block";
            } else {
                throw new Error("لم يتم إرجاع صورة");
            }
        } catch (error) {
            alert("حدث خطأ أثناء الاتصال بالخادم، يرجى المحاولة لاحقاً.");
            location.reload();
        }
    };

    function downloadImage() {
        const link = document.createElement('a');
        link.href = document.getElementById("resultPreview").src;
        link.download = 'removed-bg.png';
        link.click();
    }
</script>
</body>
</html>
