<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفريغ خلفية الصورة - Temp Box Mail</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="container">
    <div id="dropZone" class="tool-card">
        <h3>🎭 تفريغ خلفية الصورة</h3>
        <input type="file" id="imageInput" accept="image/*">
        <button class="tool-btn" onclick="processImage()">ابدأ المعالجة</button>
    </div>

    <div id="loadingZone" style="display:none;">جاري المعالجة...</div>
    <div id="resultZone" style="display:none;">
        <img id="resultPreview">
        <button id="downloadBtn" class="tool-btn">تحميل النتيجة</button>
    </div>
</main>

<div id="footer-placeholder"></div>

<script>
    // 1. جلب الهيدر والفوتر (هذه ضرورية ليظهر الموقع موحداً)
    fetch('/includes/header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
    fetch('/includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);

    // 2. دالة المعالجة الخاصة بهذه الصفحة فقط
    async function processImage() {
        const file = document.getElementById('imageInput').files[0];
        if(!file) return alert("اختر صورة");
        
        const formData = new FormData();
        formData.append('image', file);

        // غير هذا الرابط ليتناسب مع خدمة إزالة الخلفية على Hugging Face
        const response = await fetch("https://[رابط-السيرفر-الخاص-بك].hf.space/api/remove-bg", {
            method: "POST", body: formData
        });
        const data = await response.json();
        
        document.getElementById("resultPreview").src = data.image;
        document.getElementById("resultZone").style.display = "block";
    }
</script>

</body>
</html>
