<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.temp-boxmail.org/tools/watermark.html">
    
    <title id="pageTitle">إزالة الخلفية من الصور مجاناً بالذكاء الاصطناعي</title>   
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/og.webp" type="image/webp">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4901985375072472" crossorigin="anonymous"></script>
    <style>
        .tool-card { max-width: 600px; margin: 40px auto; padding: 40px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; text-align: center; color: white; }
        .tool-btn { background: #00ffcc; color: #0d1117; padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #00ffcc; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo" onclick="window.location.href='/'" style="cursor:pointer;">📧 Temp Box Mail</div>
    <button id="langBtn" class="lang-btn">EN</button>
    <nav class="menu">
      <a href="/" class="menu-link">الرئيسية</a>
      <a href="/blog/index.html" class="menu-link">المدونة</a>
      <a href="/tools/index.html" class="menu-link active">الأدوات الذكية</a>
    </nav>
  </div>
</header>

<main class="container">
    <div class="tool-card">
        <h1>🎭 تفريغ الخلفية بالذكاء الاصطناعي</h1>
        <p>ارفع صورتك وسنقوم بتفريغ الخلفية بدقة البكسل خلال ثوانٍ.</p>
        
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <button class="tool-btn" onclick="document.getElementById('imageInput').click()">اختر الصورة</button>
        
        <div id="loadingZone" style="display:none; margin-top: 20px;">
            <div class="spinner"></div>
            <p>جاري المعالجة...</p>
        </div>

        <div id="resultZone" style="display:none; margin-top: 20px;">
            <img id="resultPreview" style="max-width: 100%; border-radius: 8px;">
            <br><br>
            <button class="tool-btn" onclick="downloadImage()">📥 تحميل الصورة الشفافة</button>
        </div>
    </div>
</main>

<footer style="text-align: center; padding: 20px; color: #64748b;">
    © 2026 Temp Box Mail. All rights reserved.
</footer>
<script>
    document.getElementById('imageInput').onchange = async function() {
        const file = this.files[0];
        if(!file) return;
        
        document.getElementById('loadingZone').style.display = "block";
        const formData = new FormData();
        formData.append('image', file);

        try {
            const response = await fetch("https://hamedabdelmoez-watermark-remover.hf.space/api/remove-bg", {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            if (data.image) {
                document.getElementById('resultPreview').src = data.image;
                document.getElementById('resultZone').style.display = "block";
                document.getElementById('loadingZone').style.display = "none";
            }
        } catch (e) {
            alert("خطأ في الاتصال بالسيرفر");
            location.reload();
        }
    };

    function downloadImage() {
        const link = document.createElement('a');
        link.href = document.getElementById('resultPreview').src;
        link.download = 'removed-bg.png';
        link.click();
    }
</script>
</body>
</html>
