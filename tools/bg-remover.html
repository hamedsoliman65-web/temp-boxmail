<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفريغ خلفية الصورة - Temp Box Mail</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .tool-container { max-width: 600px; margin: 50px auto; text-align: center; background: #1e293b; padding: 30px; border-radius: 15px; }
        #resultPreview { max-width: 100%; margin-top: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="tool-container">
        <h1>🎭 تفريغ خلفية الصورة</h1>
        <input type="file" id="imageInput" accept="image/*">
        <button class="tool-btn" onclick="processImage()">ابدأ المعالجة</button>
        
        <div id="loading" style="display:none;">جاري إزالة الخلفية...</div>
        <img id="resultPreview" src="">
        <button id="downloadBtn" style="display:none;" onclick="downloadImage()">تحميل الصورة</button>
    </div>

    <script>
        async function processImage() {
            const file = document.getElementById('imageInput').files[0];
            const formData = new FormData();
            formData.append('image', file);

            document.getElementById('loading').style.display = 'block';
            
            const response = await fetch("https://[اسم-السيرفر-الخاص-بك].hf.space/api/remove-bg", {
                method: "POST", body: formData
            });
            const data = await response.json();
            
            if(data.image) {
                document.getElementById('resultPreview').src = data.image;
                document.getElementById('downloadBtn').style.display = 'block';
            }
            document.getElementById('loading').style.display = 'none';
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.href = document.getElementById('resultPreview').src;
            link.download = 'removed-bg.png';
            link.click();
        }
    </script>
</body>
</html>
