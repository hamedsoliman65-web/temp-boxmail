<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفريغ الخلفية - Temp Box Mail</title>
    <link rel="stylesheet" href="../css/style.css"> </head>
<body>

<header>
  <div class="nav">
    <div class="logo" onclick="window.location.href='/'" style="cursor:pointer;">📧 Temp Box Mail</div>
  </div>
</header>

<main class="container">
    <section class="card" style="max-width: 600px; margin: 40px auto; padding: 40px; text-align: center;">
        <h1 style="color: var(--green);">🎭 إزالة الخلفية بالذكاء الاصطناعي</h1>
        <p>ارفع صورتك وسنقوم بتفريغ الخلفية بدقة فائقة.</p>
        
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <button class="cta" onclick="document.getElementById('imageInput').click()" style="cursor:pointer;">اختر الصورة</button>
        
        <div id="loadingZone" style="display:none; margin-top:20px;">⏳ جاري المعالجة...</div>
        
        <div id="resultZone" style="display:none; margin-top:20px;">
            <img id="resultPreview" style="max-width: 100%; border-radius: 12px;">
            <br>
            <button class="cta" style="margin-top:20px;" onclick="downloadImage()">تحميل النتيجة</button>
        </div>
    </section>
</main>

<script>
    document.getElementById('imageInput').onchange = async function() {
        const file = this.files[0];
        if(!file) return;

        document.getElementById('loadingZone').style.display = 'block';
        
        const formData = new FormData();
        formData.append('image', file);

        try {
            // ضع هنا رابط الـ API الخاص بـ Hugging Face
            const res = await fetch("https://[اسم-الـ-Space-الخاص-بك].hf.space/api/remove-bg", {
                method: "POST", body: formData
            });
            const data = await res.json();
            
            if(data.image) {
                document.getElementById("resultPreview").src = data.image;
                document.getElementById("resultZone").style.display = "block";
            }
        } catch(e) {
            alert("خطأ في الاتصال بالسيرفر");
        } finally {
            document.getElementById('loadingZone').style.display = 'none';
        }
    };

    function downloadImage() {
        const link = document.createElement('a');
        link.href = document.getElementById('resultPreview').src;
        link.download = 'removed-bg.png';
        link.click();
    }
</script>
</body>
</html>
