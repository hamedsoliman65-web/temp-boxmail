<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفريغ خلفية الصورة - Temp Box Mail</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <div class="nav">
        <div class="logo" onclick="window.location.href='/'" style="cursor:pointer;">📧 Temp Box Mail</div>
        <nav class="menu">
            <a href="/">الرئيسية</a>
            <a href="/tools/index.html">الأدوات</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1 class="section-title">🎭 أداة تفريغ خلفية الصور</h1>
    
    <div id="dropZone" class="tool-card" style="max-width: 600px; margin: auto; padding: 40px; border: 1px solid var(--border); border-radius: 14px;">
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <button class="tool-btn" style="background: var(--green); color: #fff; padding: 10px 20px; border-radius: 8px; border:none; cursor:pointer;" onclick="document.getElementById('imageInput').click()">اختر الصورة</button>
        <p id="fileName">لم يتم اختيار ملف</p>
    </div>

    <div id="loadingZone" style="display:none; text-align:center; padding: 40px;">
        <div class="spinner"></div> 
        <p>جاري معالجة الصورة...</p>
    </div>

    <div id="resultZone" style="display:none; text-align:center;">
        <img id="resultPreview" style="max-width: 500px; border-radius: 12px; margin: 20px 0;">
        <br>
        <button id="downloadBtn" class="tool-btn" onclick="downloadImage()">تحميل الصورة الشفافة</button>
    </div>
</main>

<script>
    // دالة المعالجة
    document.getElementById('imageInput').onchange = async function() {
        const file = this.files[0];
        if(!file) return;
        
        document.getElementById('dropZone').style.display = "none";
        document.getElementById('loadingZone').style.display = "block";

        const formData = new FormData();
        formData.append('image', file);

        try {
            // تأكد من الرابط الصحيح لـ Hugging Face
            const response = await fetch("https://hamedabdelmoez-watermark-remover.hf.space/api/remove-bg", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            if (data.image) {
                document.getElementById("resultPreview").src = data.image;
                document.getElementById("loadingZone").style.display = "none";
                document.getElementById("resultZone").style.display = "block";
            }
        } catch (error) {
            alert("حدث خطأ، تأكد من أن السيرفر يعمل.");
            location.reload();
        }
    };

    function downloadImage() {
        const link = document.createElement('a');
        link.href = document.getElementById("resultPreview").src;
        link.download = 'removed-bg.png';
        link.click();
    }
</script>
</body>
</html>
