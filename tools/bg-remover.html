<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة تفريغ الخلفية الاحترافية - Temp Box Mail</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .tool-card { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; text-align: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #resultPreview { max-width: 100%; border-radius: 12px; margin-top: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: none; }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<main class="container">
    <section class="tool-card">
        <h1 style="color: #00ffcc;">🎭 إزالة الخلفية بالذكاء الاصطناعي</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">ارفع صورتك وسنقوم بتفريغ الخلفية بدقة البكسل خلال ثوانٍ.</p>
        
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <button class="tool-btn" onclick="document.getElementById('imageInput').click()" id="uploadBtn">اختر ملف الصورة</button>
        
        <div id="loadingZone" style="display:none;">
            <div class="spinner"></div>
            <p>جارٍ تحليل البكسلات ومعالجة الصورة...</p>
        </div>

        <div id="resultZone" style="display:none;">
            <img id="resultPreview">
            <br>
            <button class="tool-btn" style="margin-top: 20px;" onclick="downloadImage()">تحميل الصورة الشفافة</button>
        </div>
    </section>
</main>

<div id="footer-placeholder"></div>

<script>
    // جلب الهيدر والفوتر (تأكد من وجود الملفات في المسارات المحددة)
    fetch('/includes/header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
    fetch('/includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);

    document.getElementById('imageInput').onchange = async function() {
        const file = this.files[0];
        if (!file) return;

        // إظهار واجهة التحميل
        document.getElementById('uploadBtn').style.display = 'none';
        document.getElementById('loadingZone').style.display = 'block';

        const formData = new FormData();
        formData.append('image', file);

        try {
            const response = await fetch("https://[رابط-الـ-Space-الخاص-بك].hf.space/api/remove-bg", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            if (data.image) {
                const img = document.getElementById("resultPreview");
                img.src = data.image;
                img.style.display = 'block';
                document.getElementById("loadingZone").style.display = "none";
                document.getElementById("resultZone").style.display = "block";
            }
        } catch (err) {
            alert("حدث خطأ تقني، تأكد من أن السيرفر يعمل.");
            location.reload();
        }
    };

    function downloadImage() {
        const link = document.createElement('a');
        link.href = document.getElementById('resultPreview').src;
        link.download = 'temp-box-removed-bg.png';
        link.click();
    }
</script>
</body>
</html>
