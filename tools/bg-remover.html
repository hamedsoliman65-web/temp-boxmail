<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفريغ خلفية الصورة - Temp Box Mail</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <div class="nav">
        <div class="logo" onclick="window.location.href='/'" style="cursor:pointer;">📧 Temp Box Mail</div>
        <nav class="menu"><a href="/tools/index.html">الأدوات الذكية</a></nav>
    </div>
</header>

<main class="container">
    <div class="tool-card" style="max-width: 600px; margin: 40px auto; padding: 40px; background: #1e293b; border-radius: 16px; text-align: center;">
        <h1>🎭 تفريغ الخلفية</h1>
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <button onclick="document.getElementById('imageInput').click()" style="padding: 10px 20px; cursor: pointer;">اختر الصورة</button>
        
        <div id="loadingZone" style="display:none; margin-top: 20px;">جاري المعالجة...</div>
        <div id="resultZone" style="display:none; margin-top: 20px;">
            <img id="resultPreview" style="max-width: 100%;">
            <br>
            <button onclick="downloadImage()" style="margin-top: 10px;">تحميل الصورة</button>
        </div>
    </div>
</main>

<script>
    document.getElementById('imageInput').onchange = async function() {
        const file = this.files[0];
        if(!file) return;
        
        document.getElementById('loadingZone').style.display = "block";
        const formData = new FormData();
        formData.append('image', file);

        try {
            const response = await fetch("https://hamedabdelmoez-watermark-remover.hf.space/api/remove-bg", {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            if (data.image) {
                document.getElementById('resultPreview').src = data.image;
                document.getElementById('resultZone').style.display = "block";
                document.getElementById('loadingZone').style.display = "none";
            }
        } catch (e) {
            alert("خطأ في الاتصال بالخادم");
            location.reload();
        }
    };

    function downloadImage() {
        const link = document.createElement('a');
        link.href = document.getElementById('resultPreview').src;
        link.download = 'removed-bg.png';
        link.click();
    }
</script>
</body>
</html>
