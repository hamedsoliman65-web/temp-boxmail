<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إزالة الخلفية - Temp Box Mail</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 40px; border-radius: 20px; display: inline-block; width: 80%; max-width: 500px; }
        button { background: #00ffcc; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        img { max-width: 100%; margin-top: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>إزالة الخلفية بالذكاء الاصطناعي</h1>
        <input type="file" id="fileInput" accept="image/*"><br>
        <button onclick="process()">بدء الإزالة</button>
        <div id="status" style="margin-top:20px;"></div>
        <img id="result" src="">
    </div>

    <script>
        async function process() {
            const file = document.getElementById('fileInput').files[0];
            const status = document.getElementById('status');
            status.innerText = "⏳ جاري المعالجة... يرجى الانتظار";
            
            const formData = new FormData();
            formData.append('image', file);

            // استبدل الرابط أدناه برابط الـ Space الخاص بك
            const res = await fetch("https://hamedabdelmoez-watermark-remover.hf.space/api/remove-bg", {
                method: "POST", body: formData
            });
            const data = await res.json();
            document.getElementById('result').src = data.image;
            status.innerText = "✅ تم الإنجاز!";
        }
    </script>
</body>
</html>
