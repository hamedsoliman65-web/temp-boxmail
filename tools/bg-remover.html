<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفريغ خلفية الصورة - Temp Box Mail</title>
    <link rel="stylesheet" href="/css/style.css"> </head>
<body>

<div id="header-placeholder"></div>

<main class="container">
    <h1 class="section-title">🎭 أداة تفريغ خلفية الصور</h1>
    
    <div id="dropZone" class="tool-card">
        <div class="tool-icon">🎭</div>
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <button class="tool-btn" onclick="document.getElementById('imageInput').click()">اختر الصورة</button>
        <p id="fileName">لم يتم اختيار ملف</p>
    </div>

    <div id="loadingZone" style="display:none; text-align:center; padding: 40px;">
        <div class="spinner"></div> <p>جاري معالجة الصورة بالذكاء الاصطناعي...</p>
    </div>

    <div id="resultZone" style="display:none; text-align:center;">
        <img id="resultPreview" style="max-width: 500px; border-radius: 12px; margin: 20px 0;">
        <br>
        <button id="downloadBtn" class="tool-btn" style="width: auto;">تحميل الصورة الشفافة</button>
    </div>
</main>

<div id="footer-placeholder"></div>

<script>
    // ربط الهيدر والفوتر ديناميكياً
    fetch('/includes/header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
    fetch('/includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);

    // دالة المعالجة
    async function processImage() {
        const file = document.getElementById('imageInput').files[0];
        const formData = new FormData();
        formData.append('image', file);

        document.getElementById('dropZone').style.display = "none";
        document.getElementById('loadingZone').style.display = "block";

        try {
            // الرابط الخاص بـ Hugging Face
            const response = await fetch("https://[اسم-الـ-Space-الخاص-بك].hf.space/api/remove-bg", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            if (data.image) {
                document.getElementById("resultPreview").src = data.image;
                document.getElementById("loadingZone").style.display = "none";
                document.getElementById("resultZone").style.display = "block";
            }
        } catch (error) {
            alert("حدث خطأ أثناء المعالجة");
            document.getElementById('dropZone').style.display = "block";
        }
    }
    
    document.getElementById('imageInput').onchange = processImage;
</script>
</body>
</html>
